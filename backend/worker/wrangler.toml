name = "sandbox-protocol-api"
main = "src/index.js"
compatibility_date = "2026-11-06"

[vars]
# Set ALLOWED_ORIGINS to a comma-separated list of trusted app/web origins.
# Leave empty for bearer-token-only access from packaged desktop/mobile clients.
ALLOWED_ORIGINS = ""

[[r2_buckets]]
binding = "WORKSHOP_BUCKET"
bucket_name = "sandbox-protocol-workshop"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "WorkshopRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkshopRoom"]
