name: Build Sandbox Protocol Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master, feature/platform-controls, feature/local-mods-experiment ]
  push:
    branches: [ main, master, feature/local-mods-experiment ]
    paths:
      - 'app/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test AI and mod studio foundations
        run: npm test
      - name: Build searchable game knowledge index
        run: node scripts/build-knowledge.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle Three.js and Cannon.js locally
        working-directory: ./app/src/main/assets
        run: |
          mkdir -p vendor
          curl -fL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o vendor/three.min.js
          curl -fL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js -o vendor/cannon.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#vendor/three.min.js#g' index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js#vendor/cannon.min.js#g' index.html
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-protocol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
