name: Extract ZIP into Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o larrys-mod-android-github-actions.zip -d extracted

      - name: Copy files into main folder
        run: |
          cp -a extracted/. .
          rm -rf extracted
          rm -f larrys-mod-android-github-actions.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Larry's Mod project files" || echo "Nothing to commit"
          git push
