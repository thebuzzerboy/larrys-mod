name: Install Larry's Mod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p temp_extract
          unzip -o larrys-mod-android-github-actions.zip -d temp_extract

      - name: Find and move project files
        run: |
          if [ -d "temp_extract/LarrysMod" ]; then
            cp -a temp_extract/LarrysMod/. .
          else
            cp -a temp_extract/. .
          fi

      - name: Clean up
        run: |
          rm -rf temp_extract
          rm -f larrys-mod-android-github-actions.zip
          rm -rf LarrysMod

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Larry's Mod files" || echo "No changes to commit"
          git push
