name: Build Sandbox Protocol for Windows

on:
  push:
    branches:
      - feature/multi-ai-starcoder2-opt-in
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable app
        run: npm run dist:win
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-protocol-windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
